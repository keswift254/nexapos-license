<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NexaPOS Key Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"
  crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f3f8;
    --bg-accent: radial-gradient(circle at 15% -10%, rgba(99,102,241,0.12), transparent 45%);
    --card-bg: #ffffff;
    --card-border: rgba(15, 23, 42, 0.06);
    --text: #14162b;
    --muted: #6b7280;
    --field-bg: #ffffff;
    --field-border: #dfe2ec;
    --field-focus: #6366f1;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fee2e2;
    --success-soft: #dcfce7;
    --success-text: #166534;
    --err-soft: #fee2e2;
    --err-text: #991b1b;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 10px 24px -12px rgba(15,23,42,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c14;
      --bg-accent: radial-gradient(circle at 15% -10%, rgba(99,102,241,0.18), transparent 45%);
      --card-bg: #161826;
      --card-border: rgba(255,255,255,0.06);
      --text: #eef0fb;
      --muted: #9aa0b4;
      --field-bg: #1e2133;
      --field-border: #2c3049;
      --field-focus: #818cf8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99,102,241,0.16);
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --danger-soft: rgba(248,113,113,0.16);
      --success-soft: rgba(34,197,94,0.16);
      --success-text: #86efac;
      --err-soft: rgba(248,113,113,0.16);
      --err-text: #fca5a5;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -12px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 680px;
    margin: 0 auto;
    padding: 36px 20px 60px;
    background: var(--bg) var(--bg-accent);
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .page-head { margin-bottom: 24px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  p.sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14.5px;
    font-weight: 700;
    margin: 0 0 14px;
  }
  .card-title .emoji { font-size: 16px; line-height: 1; }
  .card-title .hint {
    font-weight: 500;
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
    text-align: right;
  }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  select, input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid var(--field-border);
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 14px;
    background: var(--field-bg);
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--field-focus);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--field-focus) 22%, transparent);
  }
  input::placeholder { color: #9aa0b4; }
  input:read-only {
    background: color-mix(in srgb, var(--field-bg) 60%, var(--muted) 10%);
    color: var(--muted);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.danger { background: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-hover); }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  button.secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent-soft) 70%, var(--accent) 15%); }
  .result {
    text-align: center;
    padding: 18px;
    margin-top: 14px;
    border-radius: 12px;
    background: var(--accent-soft);
    display: none;
  }
  .result.show { display: block; }
  .code {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    font-family: "SF Mono", Consolas, monospace;
    color: var(--accent);
  }
  .timer { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .msg { font-size: 13px; margin-top: 10px; padding: 11px 12px; border-radius: 10px; display: none; line-height: 1.4; }
  .msg.show { display: block; }
  .msg.ok { background: var(--success-soft); color: var(--success-text); }
  .msg.err { background: var(--err-soft); color: var(--err-text); }
  .divider-space { height: 10px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
  .progress-text { font-size: 12px; color: var(--muted); margin: -8px 0 14px; min-height: 15px; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>NexaPOS Key Generator</h1>
    <p class="sub">Run this after a customer pays. The code is redeemable for a limited window and locks to whichever device activates it first.</p>
  </div>

  <div class="card">
    <label for="serverUrl">License server address</label>
    <input id="serverUrl" value="http://localhost/nexapos_license/public/index.php">
    <label for="adminSecret">Admin secret</label>
    <input id="adminSecret" type="password" placeholder="paste your admin_secret here">
    <label for="expiryPreset">Activation window</label>
    <select id="expiryPreset" onchange="onExpiryPresetChange()">
      <option value="30">30 minutes (default)</option>
      <option value="60">1 hour</option>
      <option value="360">6 hours</option>
      <option value="1440">24 hours</option>
      <option value="4320">3 days</option>
      <option value="10080">7 days (max)</option>
      <option value="custom">Custom...</option>
    </select>
    <input id="expiryCustom" type="number" min="1" max="10080" placeholder="Minutes (1-10080)" style="display:none">
    <label for="durationPreset">Expires after (license validity, not the activation window above)</label>
    <select id="durationPreset" onchange="onDurationPresetChange()">
      <option value="">Never expires (default)</option>
      <option value="7">7 days</option>
      <option value="30">30 days</option>
      <option value="90">90 days</option>
      <option value="180">180 days</option>
      <option value="365">365 days</option>
      <option value="custom">Custom...</option>
    </select>
    <input id="durationCustom" type="number" min="1" placeholder="Days" style="display:none">
    <div class="card-title" style="margin:0 0 10px"><span class="emoji">🔑</span> Generate a license key</div>
    <button id="generateBtn" onclick="generateKey()">Generate key</button>
    <div class="result" id="result">
      <div class="code" id="codeText"></div>
      <div class="timer" id="timerText"></div>
      <div class="timer" id="durationText"></div>
    </div>
    <div class="msg" id="generateMsg"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="emoji">🚫</span> Revoke a key</div>
    <label for="revokeCode">Code to revoke (e.g. after a refund)</label>
    <input id="revokeCode" placeholder="the code to revoke">
    <button class="danger" onclick="revokeKey()">Revoke</button>
    <div class="msg" id="revokeMsg"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="emoji">⏳</span> Extend a license</div>
    <label for="extendCode">Activated code (renewal payment on an already-activated key)</label>
    <input id="extendCode" placeholder="the activated code to extend">
    <label for="extendDays">Days to add</label>
    <input id="extendDays" type="number" min="1" placeholder="e.g. 30">
    <button onclick="extendLicense()">Extend</button>
    <div class="msg" id="extendMsg"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="emoji">🚀</span> Publish app update <span class="hint">run once per real release</span></div>
    <div class="grid-2">
      <div>
        <label for="publishVersion">Version</label>
        <input id="publishVersion" placeholder="Loading current version..." readonly>
      </div>
      <div>
        <label for="publishNotes">Release notes (short summary shown to users)</label>
        <input id="publishNotes" placeholder="e.g. Safer shop switching, POS migration, and cashier updates">
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label for="publishWindowsInstallerUrl">Windows setup EXE URL</label>
        <input id="publishWindowsInstallerUrl" onchange="hashPublishFile('windowsInstaller')" oninput="updatePublishButtonState()">
        <label for="publishWindowsInstallerSha256">SHA-256 (paste it, or use Fetch &amp; verify below)</label>
        <input id="publishWindowsInstallerSha256" placeholder="Paste a SHA-256, or click Fetch & verify files" oninput="updatePublishButtonState()">
        <div class="progress-text" id="publishWindowsInstallerProgress"></div>
      </div>
      <div>
        <label for="publishAndroidUrl">Android download URL</label>
        <input id="publishAndroidUrl" onchange="hashPublishFile('android')" oninput="updatePublishButtonState()">
        <label for="publishAndroidSha256">SHA-256 (paste it, or use Fetch &amp; verify below)</label>
        <input id="publishAndroidSha256" placeholder="Paste a SHA-256, or click Fetch & verify files" oninput="updatePublishButtonState()">
        <div class="progress-text" id="publishAndroidProgress"></div>
      </div>
    </div>
    <button class="secondary" onclick="hashBothPublishFiles()" id="hashFilesBtn">Fetch &amp; verify files</button>
    <div class="msg" id="hashMsg"></div>
    <div class="divider-space"></div>
    <button onclick="publishVersion()" id="publishBtn" disabled>Publish update</button>
    <div class="msg" id="publishMsg"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="emoji">🛠️</span> Support recovery</div>
    <label for="recoveryDevice">Device ID</label>
    <input id="recoveryDevice" placeholder="Device ID from the client's login or authenticator screen">
    <button onclick="supportRecovery('reset_authenticator')">Reset authenticator</button>
    <button class="secondary" onclick="supportRecovery('issue_support_access')" style="margin-top:10px">Generate super admin recovery password</button>
    <div class="msg" id="recoveryMsg"></div>
    <input id="recoveryPassword" readonly aria-label="One-time support password" hidden>
  </div>
<script>
async function supportRecovery(action) {
  const deviceId = document.getElementById('recoveryDevice').value.trim();
  if (!deviceId) return showMsg('recoveryMsg', 'Enter the device ID.', false);
  const password = document.getElementById('recoveryPassword');
  password.hidden = true;
  password.value = '';
  try {
    const response = await fetch(serverUrl() + '?action=' + action, {
      method: 'POST',
      headers: { 'X-Admin-Secret': adminSecret(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_id: deviceId }),
    });
    const data = await response.json();
    showMsg('recoveryMsg', data.message || 'Recovery request failed.', data.success === true);
    if (data.success && data.password) {
      password.hidden = false;
      password.value = data.password;
      showMsg('recoveryMsg', 'Username: nexapos-support. ' + data.message, true);
    }
  } catch (_) { showMsg('recoveryMsg', 'Could not reach the server. Try again.', false); }
}
let countdownInterval = null;

// Defaults to wherever this page is actually being served from (local
// XAMPP or the live Render deployment) rather than a hardcoded
// localhost URL, so the same file works correctly either way without
// editing.
if (location.protocol === 'http:' || location.protocol === 'https:') {
  document.getElementById('serverUrl').value = location.origin + '/index.php';
}
loadSuggestedVersion();

// Bumps just the last dotted segment ("1.0.1" -> "1.0.2") - the common
// case by far (a bug-fix release, which is what this admin tool is
// mostly used for). A real minor/major bump is rare enough that it's
// not worth a second control for it here.
function incrementPatch(version) {
  const parts = version.split('.');
  const last = parseInt(parts[parts.length - 1], 10);
  parts[parts.length - 1] = Number.isNaN(last) ? '1' : String(last + 1);
  return parts.join('.');
}

// Locked to auto-computed-from-the-currently-published-version on
// purpose - a hand-typed version field is exactly what produced a
// broken publish once already ("Version 1.0.2" typed as literal text,
// which the app's numeric version comparison silently treated as
// 0.0.2). Deriving it removes that whole class of mistake.
//
// Also remembers the currently-published hashes (publishedShas) so
// hashPublishFile can tell "genuinely new file" apart from "someone
// published a new version number without actually rebuilding" - which
// happened twice for real (1.0.2 and again at 1.0.4/1.0.5) before this
// existed: the URLs never changed, so the "update" silently reinstalled
// the same bits every time and devices never actually moved version.
let publishedShas = { windowsInstaller: null, android: null };

// github.io/downloads/, not GitHub Releases - Releases was tried for
// real (1.0.34) on the theory that Pages' git-backed storage was the
// slow part, and it made things worse, not better: the installed app's
// own updater (a native HTTP client, not a browser - CORS never
// applied to it) downloaded the Releases-hosted installer far slower
// than every previous Pages-hosted update, confirmed by the person
// actually watching it happen. Releases also broke this page's own
// "Fetch & verify files" outright (release-assets.githubusercontent.com,
// the Azure Blob host Release downloads redirect to, sends no
// Access-Control-Allow-Origin at all). Whatever's actually slow about
// Pages for a multi-ten-megabyte file, Releases isn't the fix - keep
// committing setup EXEs/APKs under publish-site/downloads/.
function setSuggestedDownloadUrls(version) {
  document.getElementById('publishWindowsInstallerUrl').value =
    `https://keswift254.github.io/nexapos-site/downloads/NexaPOS-Setup-${version}.exe`;
  document.getElementById('publishAndroidUrl').value =
    `https://keswift254.github.io/nexapos-site/downloads/NexaPOS-${version}.apk`;
}

async function loadSuggestedVersion() {
  const field = document.getElementById('publishVersion');
  try {
    const res = await fetch(serverUrl() + '?action=latest_version');
    const data = await res.json();
    field.value = data.success && data.version ? incrementPatch(data.version) : '1.0.0';
    setSuggestedDownloadUrls(field.value);
    if (data.success) {
      publishedShas = {
        windowsInstaller: data.windows_installer_sha256 || null,
        android: data.android_sha256 || null,
      };
    }
  } catch (e) {
    field.placeholder = 'Could not auto-fill - check server address above';
  }
}

// onProgress(receivedBytes, totalBytes|0, phase, bytesPerSec) where
// phase is 'downloading' or 'hashing' - lets the caller show real
// numbers instead of a placeholder that can't be told apart from being
// stuck.
async function sha256OfUrl(url, onProgress) {
  // A multi-ten-megabyte download over a flaky connection can drop with
  // a generic "Failed to fetch" that a plain retry clears right up -
  // seen in practice on the ~75MB Android APK specifically, never the
  // much smaller Windows EXE. Three tries, no backoff needed since the
  // failure mode here is a dropped connection, not a rate limit.
  let lastError;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const total = Number(res.headers.get('Content-Length')) || 0;
      // Streamed via the reader (rather than a single res.arrayBuffer())
      // purely so onProgress has something to report as bytes actually
      // arrive - digesting still needs the whole thing assembled first,
      // since SubtleCrypto has no incremental/streaming digest API.
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      // Instantaneous rate over the window since the last UI update
      // (throttled to ~4x/sec) rather than a running average since the
      // start - a running average would still read "slow" for a while
      // after a bad start even once the transfer actually sped up.
      let windowStart = performance.now();
      let windowBytes = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        windowBytes += value.length;
        const elapsed = performance.now() - windowStart;
        if (onProgress && elapsed >= 250) {
          onProgress(received, total, 'downloading', windowBytes / (elapsed / 1000));
          windowStart = performance.now();
          windowBytes = 0;
        }
      }
      const buffer = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        buffer.set(chunk, offset);
        offset += chunk.length;
      }
      if (onProgress) onProgress(received, total, 'hashing');
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError;
}

function formatMB(bytes) {
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatSpeed(bytesPerSec) {
  return (bytesPerSec / (1024 * 1024)).toFixed(2) + ' MB/s';
}

function isValidSha256(value) {
  return /^[0-9a-f]{64}$/i.test(value.trim());
}

// Publishing no longer strictly requires this - the SHA-256 fields are
// plain editable inputs, so a hash already known from a local build
// (computed by whatever's fastest on hand, without waiting on a
// download through this page) can just be pasted in directly. This
// fetches the real file at the Windows/Android URL and hashes it
// client-side as the slower but drift-proof alternative: the hash can
// never be wrong relative to what the URL actually serves, and (see
// hashBothPublishFiles) it also catches "that URL still serves the old
// build" before a version bump announces an update with nothing new
// behind it - neither of which a pasted-in hash can promise.
async function hashPublishFile(platform) {
  const fieldIds = {
    windowsInstaller: ['publishWindowsInstallerUrl', 'publishWindowsInstallerSha256', 'publishWindowsInstallerProgress'],
    android: ['publishAndroidUrl', 'publishAndroidSha256', 'publishAndroidProgress'],
  };
  const [urlId, shaId, progressId] = fieldIds[platform];
  const urlField = document.getElementById(urlId);
  const shaField = document.getElementById(shaId);
  const progressEl = document.getElementById(progressId);
  const url = urlField.value.trim();
  if (!url) return null;
  shaField.value = '';
  shaField.placeholder = 'Fetching and hashing...';
  if (progressEl) progressEl.textContent = 'Starting…';
  try {
    const hash = await sha256OfUrl(url, (received, total, phase, bytesPerSec) => {
      if (!progressEl) return;
      if (phase === 'hashing') {
        progressEl.textContent = 'Verifying checksum…';
      } else if (total) {
        const pct = Math.round((received / total) * 100);
        progressEl.textContent = `Downloading… ${formatMB(received)} / ${formatMB(total)} (${pct}%) - ${formatSpeed(bytesPerSec)}`;
      } else {
        progressEl.textContent = `Downloading… ${formatMB(received)} - ${formatSpeed(bytesPerSec)}`;
      }
    });
    shaField.value = hash;
    shaField.placeholder = '';
    updatePublishButtonState();
    if (progressEl) progressEl.textContent = 'Verified ✓';
    return hash;
  } catch (e) {
    // GitHub Release assets redirect to release-assets.githubusercontent.com
    // (Azure Blob Storage), which sends no Access-Control-Allow-Origin at
    // all - the browser blocks the cross-origin fetch itself before this
    // page ever sees a real response, always surfacing as this same
    // generic TypeError regardless of the file or connection. There's no
    // client-side fix for that; paste the hash in directly instead (from
    // `sha256sum` / `Get-FileHash` on the file you built, or a fetch/hash
    // done against a CORS-friendly host like GitHub Pages).
    const looksLikeCors = url.includes('github.com/') && url.includes('/releases/download/');
    shaField.placeholder = looksLikeCors
      ? 'GitHub Releases blocks this kind of check (no CORS header) - paste the SHA-256 in manually instead.'
      : 'Could not fetch/hash this file: ' + e;
    if (progressEl) progressEl.textContent = '';
    updatePublishButtonState();
    return null;
  }
}

// Publish only needs both URLs filled in and both SHA-256 fields
// holding something that's at least shaped like a real hash - it
// doesn't care whether that hash arrived by typing it in or by
// hashPublishFile() actually fetching the file, so this is the single
// place both paths funnel through to arm/disarm the button.
function updatePublishButtonState() {
  const windowsInstallerUrl = document.getElementById('publishWindowsInstallerUrl').value.trim();
  const androidUrl = document.getElementById('publishAndroidUrl').value.trim();
  const windowsInstallerSha256 = document.getElementById('publishWindowsInstallerSha256').value;
  const androidSha256 = document.getElementById('publishAndroidSha256').value;
  const ready = windowsInstallerUrl && androidUrl &&
    isValidSha256(windowsInstallerSha256) && isValidSha256(androidSha256);
  document.getElementById('publishBtn').disabled = !ready;
}

async function hashBothPublishFiles() {
  const btn = document.getElementById('hashFilesBtn');
  const publishBtn = document.getElementById('publishBtn');
  btn.disabled = true;
  publishBtn.disabled = true;
  document.getElementById('hashMsg').className = 'msg';
  try {
    // Sequential, not Promise.all - measured for real: a direct browser
    // download of the same GitHub Releases file ran ~200 KB/s, but
    // fetching the ~18MB EXE and ~75MB APK at the same time through here
    // dragged both down to ~20 KB/s combined, a far worse hit than an
    // even bandwidth split would explain. Whatever the exact cause
    // (connection contention, or the two read-loops/digests competing
    // on the main thread), one at a time is dramatically faster in
    // practice despite "sounding" slower on paper.
    const windowsInstallerSha = await hashPublishFile('windowsInstaller');
    const androidSha = await hashPublishFile('android');
    if (!windowsInstallerSha || !androidSha) {
      showMsg('hashMsg', 'Could not fetch/hash one or more files - check the field(s) above for details (GitHub Releases URLs need the SHA-256 pasted in manually; see the placeholder text).', false);
      return;
    }
    const staleWindowsInstaller = publishedShas.windowsInstaller && windowsInstallerSha === publishedShas.windowsInstaller;
    const staleAndroid = publishedShas.android && androidSha === publishedShas.android;
    if (staleWindowsInstaller || staleAndroid) {
      const which = [staleWindowsInstaller && 'Windows setup EXE', staleAndroid && 'Android'].filter(Boolean).join(', ');
      showMsg(
        'hashMsg',
        `${which} file${[staleWindowsInstaller, staleAndroid].filter(Boolean).length > 1 ? 's are' : ' is'} identical to what's already published - `
          + `looks like the new build wasn't actually pushed to the download site yet. Rebuild and push first, then try again.`,
        false,
      );
      // Overrides updatePublishButtonState()'s otherwise-correct "both
      // fields look like valid hashes" verdict - a hash that's real but
      // identical to the currently-published one is exactly the case
      // this whole check exists to block.
      publishBtn.disabled = true;
      return;
    }
    showMsg('hashMsg', 'Setup EXE and APK verified and are genuinely different from the currently-published version.', true);
  } finally {
    btn.disabled = false;
  }
}

function serverUrl() {
  return document.getElementById('serverUrl').value.trim();
}
function adminSecret() {
  return document.getElementById('adminSecret').value.trim();
}
function expiryMinutes() {
  const preset = document.getElementById('expiryPreset').value;
  if (preset !== 'custom') return parseInt(preset, 10);
  return parseInt(document.getElementById('expiryCustom').value, 10) || 30;
}
function onExpiryPresetChange() {
  const isCustom = document.getElementById('expiryPreset').value === 'custom';
  document.getElementById('expiryCustom').style.display = isCustom ? 'block' : 'none';
}
function durationDays() {
  const preset = document.getElementById('durationPreset').value;
  if (preset === '') return null;
  if (preset !== 'custom') return parseInt(preset, 10);
  return parseInt(document.getElementById('durationCustom').value, 10) || null;
}
function onDurationPresetChange() {
  const isCustom = document.getElementById('durationPreset').value === 'custom';
  document.getElementById('durationCustom').style.display = isCustom ? 'block' : 'none';
}
function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
}

async function generateKey() {
  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  document.getElementById('generateMsg').className = 'msg';
  try {
    const days = durationDays();
    const res = await fetch(serverUrl() + '?action=issue', {
      method: 'POST',
      headers: { 'X-Admin-Secret': adminSecret(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ expiry_minutes: expiryMinutes(), license_duration_days: days }),
    });
    const data = await res.json();
    if (!data.success) {
      showMsg('generateMsg', data.message || 'Could not generate a key.', false);
      document.getElementById('result').className = 'result';
      return;
    }
    document.getElementById('codeText').textContent = data.code;
    document.getElementById('durationText').textContent = days
      ? `Once activated, valid for ${days} day${days === 1 ? '' : 's'}`
      : 'Once activated, never expires';
    document.getElementById('result').className = 'result show';
    startCountdown(data.expires_at);
    downloadKeyPdf(data, days);
  } catch (e) {
    showMsg('generateMsg', 'Could not reach the license server: ' + e, false);
  } finally {
    btn.disabled = false;
  }
}

// Receipt-width (80mm) rather than a full page - matches the thermal
// receipt printers these shops already use for POS receipts, and a
// single short code doesn't need a full sheet. jsPDF's own save()
// triggers a normal browser download, which lands wherever downloads
// normally go on that device (Downloads folder on desktop, the Files/
// Downloads app on mobile) - no separate device-specific handling
// needed, the browser already does the right thing per platform.
// sequence_number is license_keys.id itself (see index.php's issue
// action) - "Key No." on the PDF always matches that row 1:1.
function downloadKeyPdf(data, durationDaysValue) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: [80, 120] });
  const centerX = 40;
  let y = 12;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.text('NexaPOS License Key', centerX, y, { align: 'center' });
  y += 7;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  const seq = String(data.sequence_number ?? '').padStart(4, '0');
  doc.text(`Key No. ${seq}`, centerX, y, { align: 'center' });
  y += 8;

  doc.setDrawColor(200);
  doc.line(6, y, 74, y);
  y += 8;

  doc.setFont('courier', 'bold');
  doc.setFontSize(16);
  doc.text(data.code, centerX, y, { align: 'center' });
  y += 10;

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  const issuedAt = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
  doc.text(`Issued: ${issuedAt}`, centerX, y, { align: 'center' });
  y += 5;
  const expiresAt = (data.expires_at || '').slice(0, 16);
  doc.text(`Activation window closes: ${expiresAt}`, centerX, y, { align: 'center', maxWidth: 68 });
  y += 5;
  doc.text(
    durationDaysValue
      ? `Once activated: valid ${durationDaysValue} day${durationDaysValue === 1 ? '' : 's'}`
      : 'Once activated: never expires',
    centerX, y, { align: 'center' }
  );
  y += 8;

  doc.setDrawColor(200);
  doc.line(6, y, 74, y);
  y += 6;
  doc.setFontSize(7);
  doc.text('One-time use - locks to the first device that activates it.', centerX, y, { align: 'center', maxWidth: 68 });

  doc.save(`NexaPOS-Key-${seq}-${data.code}.pdf`);
}

function startCountdown(expiresAtUtc) {
  if (countdownInterval) clearInterval(countdownInterval);
  const expiry = new Date(expiresAtUtc.replace(' ', 'T') + 'Z').getTime();
  const tick = () => {
    const remaining = Math.max(0, Math.floor((expiry - Date.now()) / 1000));
    const timerEl = document.getElementById('timerText');
    if (remaining <= 0) {
      timerEl.textContent = 'Expired - generate a new one if the customer hasn\'t activated yet.';
      clearInterval(countdownInterval);
      return;
    }
    const d = Math.floor(remaining / 86400);
    const h = Math.floor((remaining % 86400) / 3600);
    const m = Math.floor((remaining % 3600) / 60);
    const s = remaining % 60;
    let parts;
    if (d > 0) parts = `${d}d ${h}h ${m}m`;
    else if (h > 0) parts = `${h}h ${m}m`;
    else parts = `${m}m ${s.toString().padStart(2, '0')}s`;
    timerEl.textContent = `Expires in ${parts}`;
  };
  tick();
  countdownInterval = setInterval(tick, 1000);
}

async function revokeKey() {
  const code = document.getElementById('revokeCode').value.trim();
  if (!code) return;
  document.getElementById('revokeMsg').className = 'msg';
  try {
    const res = await fetch(serverUrl() + '?action=revoke', {
      method: 'POST',
      headers: { 'X-Admin-Secret': adminSecret(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();
    if (data.success && data.revoked) {
      showMsg('revokeMsg', 'Revoked.', true);
    } else {
      showMsg('revokeMsg', data.message || 'That code was not found.', false);
    }
  } catch (e) {
    showMsg('revokeMsg', 'Could not reach the license server: ' + e, false);
  }
}

async function extendLicense() {
  const code = document.getElementById('extendCode').value.trim();
  const extraDays = parseInt(document.getElementById('extendDays').value, 10);
  document.getElementById('extendMsg').className = 'msg';
  if (!code || !extraDays || extraDays < 1) {
    showMsg('extendMsg', 'Enter the code and a positive number of days.', false);
    return;
  }
  try {
    const res = await fetch(serverUrl() + '?action=extend', {
      method: 'POST',
      headers: { 'X-Admin-Secret': adminSecret(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, extra_days: extraDays }),
    });
    const data = await res.json();
    if (data.success) {
      showMsg('extendMsg', `Extended - now valid until ${data.valid_until} UTC.`, true);
    } else {
      showMsg('extendMsg', data.message || 'Could not extend that key.', false);
    }
  } catch (e) {
    showMsg('extendMsg', 'Could not reach the license server: ' + e, false);
  }
}

async function publishVersion() {
  const version = document.getElementById('publishVersion').value.trim();
  const windowsInstallerUrl = document.getElementById('publishWindowsInstallerUrl').value.trim();
  const androidUrl = document.getElementById('publishAndroidUrl').value.trim();
  const windowsInstallerSha256 = document.getElementById('publishWindowsInstallerSha256').value.trim();
  const androidSha256 = document.getElementById('publishAndroidSha256').value.trim();
  const releaseNotes = document.getElementById('publishNotes').value.trim();
  document.getElementById('publishMsg').className = 'msg';
  if (!version || !windowsInstallerUrl || !androidUrl) {
    showMsg('publishMsg', 'Version, Windows setup EXE URL, and Android URL are all required.', false);
    return;
  }
  if (!isValidSha256(windowsInstallerSha256) || !isValidSha256(androidSha256)) {
    // Shouldn't be reachable - updatePublishButtonState() disables the
    // button until both SHA-256 fields look valid, whether pasted in
    // manually or filled by "Fetch & verify files" - but this is the
    // one action in the whole page that actually ships an update to
    // every installed device, so it gets its own belt-and-suspenders
    // check rather than trusting button-disabled state alone.
    showMsg('publishMsg', 'Both SHA-256 fields need a valid 64-character hash - paste one in, or click "Fetch & verify files".', false);
    return;
  }
  try {
    const res = await fetch(serverUrl() + '?action=set_latest_version', {
      method: 'POST',
      headers: { 'X-Admin-Secret': adminSecret(), 'Content-Type': 'application/json' },
      body: JSON.stringify({
        version,
        windows_installer_url: windowsInstallerUrl,
        android_url: androidUrl,
        windows_installer_sha256: windowsInstallerSha256,
        android_sha256: androidSha256,
        release_notes: releaseNotes,
      }),
    });
    const data = await res.json();
    if (data.success) {
      showMsg('publishMsg', `Published version ${version} - installed apps will see it on their next update check.`, true);
      // Re-arm: publishedShas now reflects what was just published, and
      // the button goes back to disabled until the next real release is
      // verified fresh - prevents an accidental double-click (or a
      // second "publish" for a version that hasn't actually changed
      // again) from sailing through on stale button-enabled state.
      publishedShas = { windowsInstaller: windowsInstallerSha256, android: androidSha256 };
      document.getElementById('publishBtn').disabled = true;
    } else {
      showMsg('publishMsg', data.message || 'Could not publish the update.', false);
    }
  } catch (e) {
    showMsg('publishMsg', 'Could not reach the license server: ' + e, false);
  }
}
