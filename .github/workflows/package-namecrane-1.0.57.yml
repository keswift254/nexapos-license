name: Package NameCrane 1.0.57 backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-namecrane-1.0.57.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f 'app/Services/Purchases.php'
          test -f 'public/index.php'
          test -f 'config/license.php'

      - name: Build deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p "package/$(dirname 'app/Services/Purchases.php')"
          cp 'app/Services/Purchases.php' "package/app/Services/Purchases.php"
          mkdir -p "package/$(dirname 'public/index.php')"
          cp 'public/index.php' "package/public/index.php"
          mkdir -p "package/$(dirname 'config/license.php')"
          cp 'config/license.php' "package/config/license.php"
          find package -type f -maxdepth 6 -print

      - uses: actions/upload-artifact@v4
        with:
          name: NexaPOS-License-Backend-1.0.57-NameCrane
          path: package/
          if-no-files-found: error
          retention-days: 30
