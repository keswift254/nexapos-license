name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app config public -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l
